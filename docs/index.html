function setTheme(t){root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}$('tg').textContent=t=='dark'?'☀️ Hell':'🌙 Dunkel'}
(()=>{let t=null;try{t=localStorage.getItem('theme')}catch(e){}setTheme(t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))})();
$('tg').onclick=()=>setTheme(root.dataset.theme=='dark'?'light':'dark');
render();
async function load(){try{const r=await fetch('stats.json?'+Date.now());if(!r.ok)return;const j=await r.json();if(!Array.isArray(j.players)||!j.players.length)return;P=j.players;SV=j.server||null;demo=false;render();if(j.updated)$('st').textContent+=' Stand: '+new Date(j.updated*1000).toLocaleString('de-DE')}catch(e){}}
load();setInterval(load,60000);
</script></body></html>
